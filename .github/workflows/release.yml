name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build DMG + standalone app
        run: ./scripts/make-dmg.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/iOSBuildManager-*.dmg
            dist/iOSBuildManager-*.app.zip
          generate_release_notes: true
